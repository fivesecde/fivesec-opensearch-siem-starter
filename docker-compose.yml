services:
  fivesec-nginx:
    build:
      context: fivesec-nginx
      dockerfile: Dockerfile
    image: fivesec-nginx:latest
    ports:
      - "8080:80"
      - "8443:443"
    networks:
      - opensearch-net
    volumes:
      - ./logs:/var/log/nginx
    security_opt:
      - no-new-privileges:true

  logstash:
    image: opensearchproject/logstash-oss-with-opensearch-output-plugin
    container_name: logstash
    volumes:
      - ./logs:/var/log/nginx
      - ./logstash/logstash.conf:/usr/share/logstash/pipeline/logstash.conf
    networks:
      - opensearch-net
    depends_on:
      - fivesec-nginx

  opensearch-node-1:
    image: opensearchproject/opensearch:3.3.2
    container_name: opensearch-node-1
    environment:
      - node.name=opensearch-node-1
      - discovery.seed_hosts=opensearch-node-1,opensearch-node-2
      - cluster.initial_cluster_manager_nodes=opensearch-node-1,opensearch-node-2
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms1024m -Xmx1024m"
      - "DISABLE_INSTALL_DEMO_CONFIG=true"
      - "DISABLE_SECURITY_PLUGIN=false"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536 
        hard: 65536
    volumes:
      - ./os-config/opensearch-node-1.yml:/usr/share/opensearch/config/opensearch.yml:ro
      - ./opensearch-data-1:/usr/share/opensearch/data
      - ./certs:/usr/share/opensearch/config/certificates:ro
      - ./os-config/security/config.yml:/usr/share/opensearch/config/opensearch-security/config.yml
      - ./os-config/security/roles.yml:/usr/share/opensearch/config/opensearch-security/roles.yml
      - ./os-config/security/roles_mapping.yml:/usr/share/opensearch/config/opensearch-security/roles_mapping.yml
      - ./os-config/security/internal_users.yml:/usr/share/opensearch/config/opensearch-security/internal_users.yml
      - ./os-config/security/action_groups.yml:/usr/share/opensearch/config/opensearch-security/action_groups.yml
      - ./os-config/security/tenants.yml:/usr/share/opensearch/config/opensearch-security/tenants.yml
      - ./os-config/security/nodes_dn.yml:/usr/share/opensearch/config/opensearch-security/nodes_dn.yml
      - ./os-config/security/whitelist.yml:/usr/share/opensearch/config/opensearch-security/whitelist.yml
    ports:
      - "9200:9200"
      - "9600:9600"
    networks:
      - opensearch-net
    user: "1000:1000"
    healthcheck:
      test: ["CMD-SHELL", "curl -k -s -u admin:${OPENSEARCH_ADMIN_PASSWORD} https://localhost:9200/_cluster/health | grep -q '\"status\":\"green\\|yellow\"'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  opensearch-node-2:
    image: opensearchproject/opensearch:3.3.2
    container_name: opensearch-node-2
    environment:
      - node.name=opensearch-node-2
      - discovery.seed_hosts=opensearch-node-1,opensearch-node-2
      - cluster.initial_cluster_manager_nodes=opensearch-node-1,opensearch-node-2
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms1024m -Xmx1024m"
      - "DISABLE_INSTALL_DEMO_CONFIG=true"
      - "DISABLE_SECURITY_PLUGIN=false"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - ./os-config/opensearch-node-2.yml:/usr/share/opensearch/config/opensearch.yml
      - ./opensearch-data-2:/usr/share/opensearch/data
      - ./certs:/usr/share/opensearch/config/certificates:ro
      - ./os-config/security/config.yml:/usr/share/opensearch/config/opensearch-security/config.yml
      - ./os-config/security/roles.yml:/usr/share/opensearch/config/opensearch-security/roles.yml
      - ./os-config/security/roles_mapping.yml:/usr/share/opensearch/config/opensearch-security/roles_mapping.yml
      - ./os-config/security/internal_users.yml:/usr/share/opensearch/config/opensearch-security/internal_users.yml
      - ./os-config/security/action_groups.yml:/usr/share/opensearch/config/opensearch-security/action_groups.yml
      - ./os-config/security/tenants.yml:/usr/share/opensearch/config/opensearch-security/tenants.yml
      - ./os-config/security/nodes_dn.yml:/usr/share/opensearch/config/opensearch-security/nodes_dn.yml
      - ./os-config/security/whitelist.yml:/usr/share/opensearch/config/opensearch-security/whitelist.yml
    networks:
      - opensearch-net
    user: "1000:1000"
    healthcheck:
      test: ["CMD-SHELL", "curl -k -s -u admin:${OPENSEARCH_ADMIN_PASSWORD} https://localhost:9200/_cluster/health | grep -q '\"status\":\"green\\|yellow\"'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"


  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:3.3.0
    container_name: opensearch-dashboards
    ports:
      - "5601:5601"
    environment:
      - OPENSEARCH_USERNAME=admin
      - OPENSEARCH_PASSWORD=${OPENSEARCH_ADMIN_PASSWORD}
      - DISABLE_INSTALL_DEMO_CONFIG=false
    expose:
      - "5601"
    volumes:
      - "./certs:/usr/share/opensearch-dashboards/config/certificates:ro"
      - "./os-config/opensearch-dashboards.yml:/usr/share/opensearch-dashboards/config/opensearch_dashboards.yml"
    networks:
      - opensearch-net
    user: "1000:1000"
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  opensearch-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.100.0/24
